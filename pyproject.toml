[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "source-agnostic-llm-router"
version = "0.4.0"
description = "Self-provisioning LLM gateway with capability routing, failover, MCP, and Home Assistant support"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "LLM Router contributors" }]
keywords = ["llm", "router", "mcp", "model-routing", "failover"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=2,<3",
  "starlette>=0.38,<2",
  "uvicorn>=0.30,<1",
  "tomli>=2,<3; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8",
]

[project.scripts]
llm-router = "llm_router.cli:main"
llm-router-mcp = "llm_router.mcp_server:main"
llm-router-gateway = "llm_router.gateway:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/source-agnostic-llm-router/config" = [
  "config/router.example.toml",
  "config/router.ha.example.toml",
  "config/router.env.example",
]
"share/source-agnostic-llm-router/plugins/llm-router" = ["plugins/llm-router/.mcp.json"]
"share/source-agnostic-llm-router/plugins/llm-router/.codex-plugin" = ["plugins/llm-router/.codex-plugin/plugin.json"]
"share/source-agnostic-llm-router/plugins/llm-router/skills/route-llm-query" = ["plugins/llm-router/skills/route-llm-query/SKILL.md"]
"share/source-agnostic-llm-router/plugins/llm-router/skills/route-llm-query/agents" = ["plugins/llm-router/skills/route-llm-query/agents/openai.yaml"]
"share/source-agnostic-llm-router/plugins/llm-router/skills/route-llm-query/references" = ["plugins/llm-router/skills/route-llm-query/references/configuration.md"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
