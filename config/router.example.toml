# Optional overrides for automatic discovery. Copy to router.toml only when
# you need fixed endpoints, exact metadata/prices, or custom routing policy.
# Replace placeholders, set credentials in the environment, and enable only
# deployments that really exist. Explicit IDs override matching discoveries.

[router]
# Use "priority" here when model `priority` values should dominate quality,
# latency, and cost tie-breaking. Hard capability/context limits still apply.
default_strategy = "quality"
max_attempts = 4
capability_threshold = 0.55
circuit_breaker_failures = 3
circuit_breaker_cooldown_seconds = 30
latency_ewma_alpha = 0.25
diversify_fallbacks = true
health_check_interval_seconds = 15
health_check_timeout_seconds = 2

# See router.ha.example.toml for machine_id, DNS/VPN names, discover=true,
# and replica_group aliases with preferred-machine / -nofailover behavior.

# Two independent addresses can expose the same logical model. They remain
# separate deployments so health, latency, and failover are source-specific.
[endpoints.frontier-us]
adapter = "openai-responses"
base_url = "https://llm-us.example.net/v1"
api_key_env = "FRONTIER_US_API_KEY"
timeout_seconds = 120

[endpoints.frontier-eu]
adapter = "openai-responses"
base_url = "https://llm-eu.example.net/v1"
api_key_env = "FRONTIER_EU_API_KEY"
timeout_seconds = 120

[endpoints.messages-direct]
adapter = "anthropic-messages"
base_url = "https://messages.example.net"
api_key_env = "MESSAGES_API_KEY"
timeout_seconds = 120

[endpoints.generation-direct]
adapter = "gemini-generate"
base_url = "https://generation.example.net/v1beta"
api_key_env = "GENERATION_API_KEY"
timeout_seconds = 120

[endpoints.fast-host]
adapter = "openai-compatible"
base_url = "https://fast.example.net/v1"
api_key_env = "FAST_HOST_API_KEY"
timeout_seconds = 45

[endpoints.private-a]
adapter = "openai-compatible"
base_url = "http://10.20.0.11:8080/v1"
timeout_seconds = 90

[endpoints.private-a.auth]
scheme = "none"

[endpoints.private-b]
adapter = "openai-compatible"
base_url = "http://10.30.0.12:8080/v1"
timeout_seconds = 90

[endpoints.private-b.auth]
scheme = "none"

[endpoints.local-a]
adapter = "ollama-chat"
base_url = "http://127.0.0.1:11434"
timeout_seconds = 180

[endpoints.local-b]
adapter = "ollama-chat"
base_url = "http://192.0.2.42:11434"
timeout_seconds = 180

# Prices below are illustrative so the scoring behavior is visible. Replace
# them with the rates that actually apply to each account/source.

[[models]]
id = "frontier-reasoner-us"
endpoint = "frontier-us"
upstream_model = "replace-with-frontier-reasoner"
quality = 0.98
context_window = 200000
max_output_tokens = 32000
input_cost_per_million = 8.0
output_cost_per_million = 32.0
estimated_latency_ms = 8500
reliability = 0.97
capabilities = { general = 0.98, reasoning = 1.0, coding = 0.97, math = 0.98, tool_use = 0.96, structured_output = 0.96, long_context = 0.94 }
tags = ["frontier", "primary", "us"]
enabled = false

