name: Ubuntu compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        python-version: ["3.10", "3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    env:
      LLM_ROUTER_AUTO_PROVISION: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest
      - run: python -m compileall -q src tests
      - run: sh -n install.sh
      - run: llm-router --help
      - run: llm-router-gateway --help
      - run: llm-router-mcp --help
      - name: Exercise isolated installer
        if: matrix.python-version == '3.10'
        env:
          LLM_ROUTER_SOURCE: "."
          LLM_ROUTER_INSTALL_DIR: ${{ runner.temp }}/llm-router-install
          LLM_ROUTER_BIN_DIR: ${{ runner.temp }}/llm-router-bin
        run: ./install.sh
      - name: Validate generated systemd service
        if: matrix.python-version == '3.10'
        env:
          LLM_ROUTER_INSTALL_DIR: ${{ runner.temp }}/llm-router-install
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from llm_router.service import write_user_service

          write_user_service(
              Path(os.environ["LLM_ROUTER_INSTALL_DIR"]),
              Path(os.environ["RUNNER_TEMP"]) / "llm-router-config",
          )
          PY
          systemd-analyze verify "$RUNNER_TEMP/llm-router-config/systemd/user/llm-router.service"

  package:
    runs-on: ubuntu-24.04
    env:
      LLM_ROUTER_AUTO_PROVISION: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/llm-router-wheel-smoke
      - run: /tmp/llm-router-wheel-smoke/bin/python -m pip install dist/*.whl
      - run: /tmp/llm-router-wheel-smoke/bin/llm-router --help
      - run: /tmp/llm-router-wheel-smoke/bin/llm-router-gateway --help
      - run: /tmp/llm-router-wheel-smoke/bin/llm-router-mcp --help
